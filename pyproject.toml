[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-memo-review"
version = "1.1.0"
description = "规则显化、四插槽全可插拔的语音复盘引擎与跨 AI 插件（支持 Antigravity / Claude Code / Codex / Cursor）"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.scripts]
vmr = "voice_review.cli:main"

[tool.setuptools.packages.find]
include = ["voice_review*"]
